services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: launchkit
      POSTGRES_USER: launchkit
      POSTGRES_PASSWORD: launchkit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchkit"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - launchkit-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6380:6379"

  web:
    build:
      context: .
      target: web
    environment: &launchkit-environment
      LAUNCHKIT_DATA_MODE: postgres
      LAUNCHKIT_SESSION_SECRET: local-container-demo-secret-change-before-deployment
      LAUNCHKIT_INLINE_JOBS: "false"
      DATABASE_URL: postgresql://launchkit:launchkit@database:5432/launchkit
      REDIS_URL: redis://redis:6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      target: worker
    environment: *launchkit-environment
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  launchkit-data:
