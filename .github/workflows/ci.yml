name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - run: npm run validate

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          LAUNCHKIT_DATA_MODE: memory
          LAUNCHKIT_INLINE_JOBS: "true"

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - run: docker compose up --detach --wait --wait-timeout 180
      - run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3003/api/health
      - if: always()
        run: docker compose down --volumes
